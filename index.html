<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNN MOVIE LK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎬 BNN MOVIE LK</h1>
        <p>ඔබේ ප්‍රියතම චිත්‍රපට සොයන්න</p>
    </header>

    <section class="search-section">
        <input type="text" id="searchInput" placeholder="චිත්‍රපටයක් සොයන්න...">
        <button id="searchBtn">සොයන්න</button>
    </section>

    <section class="category-tabs">
        <button class="tab-btn active" data-category="popular">ජනප්‍රිය</button>
        <button class="tab-btn" data-category="now_playing">දැන් තිරගත වන</button>
        <button class="tab-btn" data-category="top_rated">ඉහළම ශ්‍රේණිගත</button>
        <button class="tab-btn" data-category="upcoming">ඉදිරියට එන</button>
    </section>

    <main id="movieContainer" class="movie-grid"></main>

    <!-- Modal for movie details -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
